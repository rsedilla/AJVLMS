# CLAUDE.md §10: nothing reaches `main` unless this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only. Real values live in .env on each machine.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0000000000
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for the migration guard and secret scan

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Forbidden files, secrets, real student numbers (§0)
        run: node scripts/check-staged.mjs --all

      - name: Migration guard (§5 D7). Committed migrations are never edited
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MD "origin/${{ github.base_ref }}...HEAD" -- 'drizzle/*.sql' || true)
          if [ -n "$changed" ]; then echo "::error::Existing migrations were modified or deleted:"; echo "$changed"; exit 1; fi

      - run: pnpm typecheck
      - run: pnpm lint --max-warnings=0
      - run: pnpm test:coverage
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
